[project]
name = "bank-marketing-term-deposit-subscription-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Azeez Adebayo", email = "azeez.adedayo@yahoo.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.7",
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.4.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
    "xgboost>=3.2.0",
]

[project.scripts]
bank-marketing-term-deposit-subscription-model = "bank_marketing_term_deposit_subscription_model:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[model.settings]
model-path = "artifacts"
model-name = "logistic_model_pipeline_with_standardscaler"
